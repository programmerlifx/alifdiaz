<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>404 — alifdiaz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@200..800&family=Source+Serif+4:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --cobalt:#2540D9; --on-cobalt:#F4F6FF; --accent:#FFD84D;
  --sans:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%}
body{margin:0;background:var(--cobalt);color:var(--on-cobalt);font-family:var(--serif);min-height:100svh;display:flex;flex-direction:column;justify-content:space-between;padding:clamp(1.25rem,4vw,3rem)}
a{color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
header{font-family:var(--sans);font-weight:600;font-size:1.1rem;letter-spacing:-.01em}
header a{text-decoration:none}
main{display:flex;flex-direction:column;gap:1.5rem;max-width:60rem}
.code{margin:0;font-family:var(--sans);font-weight:200;font-stretch:80%;font-size:clamp(7rem,32vw,22rem);line-height:.8;letter-spacing:-.05em;user-select:none}
.code span{display:inline-block;transition:font-variation-settings .35s ease}
h1{font-family:var(--sans);font-weight:600;font-size:clamp(1.6rem,3.6vw,2.6rem);letter-spacing:-.02em;line-height:1.15;margin:0}
p{margin:0;font-size:1.15rem;line-height:1.6;max-width:44ch;opacity:.9}
.actions{display:flex;flex-wrap:wrap;gap:.75rem;margin-top:.5rem}
.btn{font-family:var(--sans);font-weight:600;font-size:1rem;text-decoration:none;padding:.8rem 1.25rem;border-radius:999px;border:2px solid var(--on-cobalt);transition:background .2s,color .2s}
.btn.solid{background:var(--on-cobalt);color:var(--cobalt)}
.btn:hover{background:var(--accent);border-color:var(--accent);color:var(--cobalt)}
footer{font-family:var(--sans);font-size:.9rem;opacity:.75;display:flex;flex-wrap:wrap;gap:.5rem 1.5rem;justify-content:space-between}
@media (prefers-reduced-motion:reduce){.code span{transition:none}}
</style>
</head>
<body>
<header><a href="/">alifdiaz</a></header>

<main>
  <p class="code" id="code" aria-hidden="true"><span>4</span><span>0</span><span>4</span></p>
  <h1>Halaman ini tidak ketemu.</h1>
  <p>Mungkin link-nya sudah pindah, atau ada salah ketik. Coba kembali ke beranda atau langsung kirim email kalau mau tanya sesuatu.</p>
  <div class="actions">
    <a class="btn solid" href="/">Kembali ke beranda</a>
    <a class="btn" href="mailto:diazalif807@gmail.com">Kirim email</a>
  </div>
</main>

<footer>
  <span>diazalif807@gmail.com</span>
  <span>© 2026 alifdiaz</span>
</footer>

<script>
(function(){
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  var spans=document.querySelectorAll('#code span'),t0=performance.now();
  var base=[200,800,200];
  function frame(t){
    var e=(t-t0)/1000;
    spans.forEach(function(s,i){
      var w=base[i]+(i===1?300:0)*(0.5+0.5*Math.sin(e*1.6-i*0.9));
      s.style.fontVariationSettings='"wght" '+Math.round(w);
    });
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
